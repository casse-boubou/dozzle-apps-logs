---
name: Deploy

concurrency:
  group: queue

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  release:
    types:
      - published
      - edited
  workflow_dispatch:

env:
  USERNAME: ${{ github.actor }}
  PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write


jobs:
  test_files:
    name: Test files
    runs-on: ubuntu-latest

    steps:
        - name: Checkout repository
          uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

        # check bash integrity
        - name: Run ShellCheck
          uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
          with:
            scandir: './docker'
            additional_files: 'healthcheck'
            severity: warning
        # check dockerfile integrity
        - name: Run hadolint
          uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
          with:
              ignore: DL3002
              dockerfile: ./docker/Dockerfile
        - name: Run hadolint
          uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
          with:
              ignore: DL3002
              dockerfile: ./docker/Dockerfile_DEV
        # check compose.yml integrity
        - name: Lint docker-compose.yml
          run: |
            docker compose -f docker/docker-compose.yml config --quiet
            docker compose -f docker/docker-compose-DEV.yml config --quiet


  build:
    needs: test_files
    name: Build docker image
    runs-on: ubuntu-latest

    steps:
        - name: Checkout repository
          uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

        # Set up BuildKit Docker container builder to be able to build
        # multi-platform images and export cache
        # https://github.com/docker/setup-buildx-action
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

        # Login against a Docker registry except on PR
        # https://github.com/docker/login-action
        - name: Log in to the Container registry
          if: |
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'release'
          uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ env.USERNAME }}
            password: ${{ env.PASSWORD }}

        # Extract metadata (tags, labels) for Docker
        # https://github.com/docker/metadata-action
        - name: Extract Docker metadata
          id: meta
          uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
          with:
            images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            tags: |
              # if push on repo
              type=raw,value=main,enable=${{ github.event_name == 'push' }}
              type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' }}
              # if release
              type=raw,value=latest,enable=${{ github.event_name == 'release' }}
              type=semver,pattern={{version}},prefix=v,enable=${{ github.event_name == 'release' }}

        # Build and push Docker image with Buildx (don't push on PR)
        # https://github.com/docker/build-push-action
        - name: Build and push Docker image
          id: build-and-push
          uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
          with:
            context: ./docker
            file: ./docker/Dockerfile
            push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max